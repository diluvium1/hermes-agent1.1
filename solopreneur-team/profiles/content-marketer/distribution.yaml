name: content-marketer
version: 1.0.0
description: >-
  Content & marketing specialist for a multi-venture solopreneur. Builds
  newsletters (e.g. Launchly Digest), runs content calendars, and repurposes
  content across channels — driven by the shared business registry.
hermes_requires: ">=0.12.0"
author: "Solopreneur Team Kit"
license: "MIT"

env_requires:
  - name: GEMINI_API_KEY
    description: "Google Gemini API key (default model for draft volume)"
    required: false
    default: ""
  - name: ANTHROPIC_API_KEY
    description: "Anthropic API key (for final polish / when switched to Claude)"
    required: false
    default: ""
  - name: NOTION_API_KEY
    description: "Notion key for content calendars (bundled notion skill)"
    required: false
    default: ""
  - name: AIRTABLE_API_KEY
    description: "Airtable key for content tracking (bundled airtable skill)"
    required: false
    default: ""
  - name: TELEGRAM_BOT_TOKEN
    description: "Telegram bot token for delivery"
    required: false
    default: ""
  - name: SLACK_BOT_TOKEN
    description: "Slack bot token for delivery"
    required: false
    default: ""

distribution_owned:
  - SOUL.md
  - config.yaml
  - mcp.json
  - skills/
  - cron/
